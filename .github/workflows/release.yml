name: NexusEnchants Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dfile.encoding=UTF-8

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # A release is never built from a revision that has not passed the full suite.
      - name: Run the complete test suite
        run: ./gradlew --no-daemon clean check --stacktrace

      - name: Build the release jar from the tag
        run: ./gradlew --no-daemon build shadowJar -PprojectVersion=${TAG#v} --stacktrace
        env:
          TAG: ${{ steps.tag.outputs.name }}

      - name: Verify the release artifact
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -name "NexusEnchants-*.jar" -print -quit)"
          if [ -z "$jar_file" ]; then
            echo "::error::No NexusEnchants jar was produced"
            exit 1
          fi
          echo "jar_file=$jar_file" >> "$GITHUB_ENV"
          unzip -p "$jar_file" plugin.yml | head -20

      - name: Extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ -f docs/CHANGELOG.md ]; then
            body="$(awk -v version="## [$version]" 'index($0, version) == 1 {flag=1; next} /^## \[/ {flag=0} flag' docs/CHANGELOG.md)"
          else
            body=""
          fi
          if [ -z "$body" ]; then
            body="Release ${TAG}. See docs/CHANGELOG.md for details."
          fi
          {
            echo "body<<EOF"
            echo "$body"
            echo ""
            echo "**Artifact:** $(basename "$jar_file")"
            echo "**Target:** Paper 26.3, Java 25"
            echo "**Build:** GitHub Actions run ${GITHUB_RUN_ID}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: NexusEnchants ${{ steps.tag.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
          files: ${{ env.jar_file }}
          draft: false
          prerelease: false
