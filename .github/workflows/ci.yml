name: NexusEnchants CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps Gradle from writing a shared cache outside the job workspace and
  # makes the build reproducible on hosted runners.
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dfile.encoding=UTF-8

jobs:
  verify:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Fails the job on a Gradle deprecation that becomes an error in the next major.
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify Java toolchain
        run: java -version

      # `check` runs Checkstyle, the resource/migration validation tests, the unit,
      # database and MockBukkit integration tests and the 1,000,000-iteration
      # statistical suite. `build` produces the shaded plugin jar.
      - name: Compile, test and package
        run: ./gradlew --no-daemon clean check build --stacktrace

      - name: Show test summary
        if: always()
        run: |
          if [ -d build/test-results ]; then
            find build/test-results -name '*.xml' -print0 \
              | xargs -0 -r grep -h '<testsuite ' \
              | sed -E 's/.*name="([^"]+)".*tests="([0-9]+)".*failures="([0-9]+)".*errors="([0-9]+)".*/\1: tests=\2 failures=\3 errors=\4/' \
              | sort
          else
            echo "No test results were produced."
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/reports/checkstyle
          if-no-files-found: warn
          retention-days: 7

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexusEnchants
          # Only the shaded plugin jar; the plain jar and reports stay internal.
          path: build/libs/NexusEnchants-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Verify the jar was produced
        if: success()
        run: |
          set -euo pipefail
          ls -l build/libs
          test -n "$(find build/libs -maxdepth 1 -name 'NexusEnchants-*.jar' -print -quit)"
