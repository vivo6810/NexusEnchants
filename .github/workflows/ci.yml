name: NexusEnchants CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps Gradle from writing a shared cache outside the job workspace and
  # makes the build reproducible on hosted runners.
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dfile.encoding=UTF-8

jobs:
  verify:
    name: Build, test and package
    # Pinned so the Ubuntu 26 migration of `ubuntu-latest` cannot change this job
    # without review.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-gradle v6 validates every gradle-wrapper.jar checksum against the
      # official SHA-256 list automatically, so no separate wrapper-validation
      # step is needed.
      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify Java toolchain
        run: java -version

      # `check` runs Checkstyle, the resource/migration validation tests, the unit,
      # database and MockBukkit integration tests and the 1,000,000-iteration
      # statistical suite. `build` produces the shaded plugin jar.
      - name: Compile, test and package
        run: ./gradlew --no-daemon clean check build --stacktrace

      - name: Show test summary
        if: always()
        run: |
          if [ -d build/test-results ]; then
            find build/test-results -name '*.xml' -print0 \
              | xargs -0 -r grep -h '<testsuite ' \
              | sed -E 's/.*name="([^"]+)".*tests="([0-9]+)".*failures="([0-9]+)".*errors="([0-9]+)".*/\1: tests=\2 failures=\3 errors=\4/' \
              | sort
          else
            echo "No test results were produced."
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/reports/checkstyle
          if-no-files-found: warn
          retention-days: 7

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: NexusEnchants
          # Only the shaded plugin jar; the plain jar and reports stay internal.
          path: build/libs/NexusEnchants-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Verify the jar was produced
        if: success()
        run: |
          set -euo pipefail
          ls -l build/libs
          jar_file="$(find build/libs -maxdepth 1 -name 'NexusEnchants-*.jar' ! -name '*-plain.jar' -print -quit)"
          if [ -z "$jar_file" ]; then
            echo "::error::No shaded NexusEnchants jar was produced"
            exit 1
          fi
          if unzip -l "$jar_file" plugin.yml >/dev/null 2>&1; then echo "plugin.yml present in $jar_file"; else echo "::error::$jar_file lacks plugin.yml"; exit 1; fi
          # Keep the distribution small; see docs/DECISIONS.md ADR-013.
          size=$(stat -c%s "$jar_file")
          mb=$((size / 1024 / 1024))
          echo "Shaded jar: $jar_file = $size bytes ($mb MB)"
          if [ "$mb" -gt 7 ]; then
            echo "::error::The shaded jar grew past 7 MB; the native/protobuf exclusions degraded"
            exit 1
          fi
          # The plain jar must not exist: the shaded jar is the only artifact.
          if find build/libs -maxdepth 1 -name '*-plain.jar' | grep -q .; then
            echo "::error::A -plain jar leaked into build/libs"
            exit 1
          fi
