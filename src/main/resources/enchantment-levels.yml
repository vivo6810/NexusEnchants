# ---------------------------------------------------------------------------
# NexusEnchants - enchantment level probabilities
#
# Independent level weights. Weights are normalised across the levels that are
# both configured and legal for the enchantment, so level 5 can never be
# produced by an enchantment whose maximum level is 3.
# ---------------------------------------------------------------------------

enchantment-levels:
  enabled: true

  default:
    level-1: 45
    level-2: 30
    level-3: 15
    level-4: 7
    level-5: 3

  overrides:
    MENDING:
      level-1: 100

    EFFICIENCY:
      level-1: 30
      level-2: 25
      level-3: 20
      level-4: 15
      level-5: 10
